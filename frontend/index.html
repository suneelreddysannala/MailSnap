<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MailSnap</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 40px; background-color: #f9f9f9; }
    h1 { color: #333; }
    button {
      background-color: #4285F4; color: white; padding: 10px 20px;
      border: none; border-radius: 4px; font-size: 16px;
    }
    .summary-card {
      background-color: white; padding: 15px; margin: 10px 0;
      border-left: 4px solid #4285F4; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <h1>📬 MailSnap</h1>
  <p>Click below to fetch and summarize your 5 latest unread emails:</p>
  <a href="/auth"><button>Sign in with Google</button></a>

  <h3>📄 Summarized Emails</h3>
  <div id="summaries"></div>

  <script>
    async function loadSummaries() {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get("done") === "true") {
        try {
          const res = await fetch("/summaries");
          const data = await res.json();
          const container = document.getElementById("summaries");

          if (Object.keys(data.summaries).length === 0) {
            container.innerHTML = "<p>No summaries found.</p>";
            return;
          }

          for (const [key, value] of Object.entries(data.summaries)) {
            const div = document.createElement("div");
            div.className = "summary-card";
            div.innerHTML = `<strong>${key}:</strong> ${value}`;
            container.appendChild(div);
          }
        } catch (err) {
          console.error("Failed to fetch summaries:", err);
        }
      }
    }

    window.onload = loadSummaries;
  </script>
</body>
</html>
